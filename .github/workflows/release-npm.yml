name: Release and Publish Package to npm

on:
  release:
    types:
      - published

  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to publish, for example v2.2.0"
        required: true
        type: string
      prerelease:
        description: "Publish package with npm dist-tag next"
        required: false
        default: false
        type: boolean

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ inputs.tag_name }}"
            PRERELEASE="${{ inputs.prerelease }}"
          else
            TAG_NAME="${{ github.event.release.tag_name }}"
            PRERELEASE="${{ github.event.release.prerelease }}"
          fi

          VERSION="${TAG_NAME#v}"

          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag_name }}

      - name: Setup Node for npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run build
        run: npm run build

      - name: Sync package version with release tag
        shell: bash
        run: |
          npm version "${{ steps.release.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Pack npm tarball
        run: npm pack

      - name: Publish package to npm
        shell: bash
        run: |
          if [ "${{ steps.release.outputs.prerelease }}" = "true" ]; then
            npm publish --access public --tag next --registry=https://registry.npmjs.org
          else
            npm publish --access public --registry=https://registry.npmjs.org
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}